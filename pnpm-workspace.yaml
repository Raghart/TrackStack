packages:
  - backend
  - frontend
  - schemas

# pnpm bloquea los scripts de instalación por defecto (supply-chain security).
# Solo se permite ejecutar postinstall a los paquetes que compilan/descargan
# binarios nativos; el resto queda explícitamente bloqueado.
allowBuilds:
  '@swc/core': true
  esbuild: true
  '@prisma/engines': true
  prisma: true
  '@apollo/protobufjs': false
  '@google/genai': false
  '@nestjs/core': false
  protobufjs: false

overrides:
  '@babel/core@<=7.29.0': ^7.29.6
  '@graphql-tools/utils@<=12.0.0': ^12.0.1
  '@graphql-tools/utils@>=10.10.1 <=12.0.1': ^12.0.2
