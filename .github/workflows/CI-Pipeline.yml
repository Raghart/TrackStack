name: Continuous Integration

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

jobs:
  Frontend-Pipeline:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check style
        run: pnpm run lint
        working-directory: ./frontend

      - name: Check security
        run: pnpm exec eslint .
        working-directory: ./frontend

      - name: Run tests
        run: pnpm run test
        working-directory: ./frontend

  Backend-Pipeline:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check style
        run: pnpm run lint
        working-directory: ./backend

      - name: Check security
        run: pnpm exec eslint .
        working-directory: ./backend

      - name: Run tests
        run: pnpm run test
        working-directory: ./backend

  Schemas-Pipeline:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm exec tsc -p tsconfig.json --noEmit
        working-directory: ./schemas

      - name: Run tests
        run: pnpm run test
        working-directory: ./schemas

  Playwright-E2E-Tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Installing Frontend and Backend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Frontend
        run: pnpm run build
        working-directory: ./frontend

      - name: Build Backend
        run: pnpm run build
        working-directory: ./backend

      - name: Install Playwright Browsers
        run: pnpm --filter ./e2e exec playwright install --with-deps

      - name: Run Server
        run: pnpm run start:prod &
        working-directory: ./backend
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_SSL: "true"
          DB_SSL_CA: certs/ca.pem

      - name: Running Playwright tests
        run: pnpm run test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 30